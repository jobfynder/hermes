# Include ONLY from the Hermes proxy host's persistent NPM Advanced config.
# This file is server context; never include it in server_proxy.conf globally.
client_max_body_size 2m;
client_body_timeout 30s;
client_header_timeout 30s;
proxy_connect_timeout 10s;
proxy_send_timeout 90s;
proxy_read_timeout 90s;
proxy_request_buffering on;
proxy_buffering on;
error_page 413 = @hermes_payload_too_large;
location @hermes_payload_too_large {
    default_type application/json;
    return 413 '{"detail":{"code":"PAYLOAD_TOO_LARGE"}}';
}

location = /channels/intake/file {
    client_max_body_size 12m;
    include conf.d/include/proxy.conf;
}
location = /understanding/parse-file {
    client_max_body_size 12m;
    include conf.d/include/proxy.conf;
}
location = /channels/telegram/webhook {
    client_max_body_size 256k;
    include conf.d/include/proxy.conf;
}
