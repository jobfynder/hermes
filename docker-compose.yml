services:
  hermes-api:
    build: .
    container_name: hermes-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - /opt/jobfynder-docs:/jobfynder-docs
      - /opt/hermes-runtime:/hermes-runtime:ro

    environment:
      - HERMES_RBAC_ENFORCEMENT=disabled
      - HERMES_ACCESS_CONTROL_FILE=/hermes-runtime/access-control/users.json

    extra_hosts:
      - "host.docker.internal:host-gateway"
