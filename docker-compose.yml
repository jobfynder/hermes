services:
  # Landing database for parsed emails: drafts, claim-and-verify state,
  # field provenance, dedupe index, and intake history. Dedicated to
  # Hermes -- not shared with Jobfynder Core's database -- matching the
  # "Hermes proposes, Core executes" boundary (docs/
  # hermes-architecture-frozen-v1.md section 2): a bad parse or a bug
  # here can never directly corrupt Core's job board data, since nothing
  # reaches Core until an explicit, separate push step.
  hermes-postgres:
    image: postgres:16
    container_name: hermes-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_USER=hermes
      - POSTGRES_PASSWORD=${HERMES_POSTGRES_PASSWORD}
      - POSTGRES_DB=hermes

    volumes:
      - /opt/hermes-postgres-data:/var/lib/postgresql/data

    # Not published to the host -- only reachable from other containers
    # on this compose stack's network (hermes-api, hermes-graph-consumer).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 5s
      timeout: 5s
      retries: 10

  hermes-api:
    build: .
    container_name: hermes-api
    restart: unless-stopped
    depends_on:
      hermes-postgres:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - /opt/jobfynder-docs:/jobfynder-docs
      - /opt/hermes-runtime:/hermes-runtime

    environment:
      - PYTHONPATH=/app
      - HERMES_ENV=production
      - HERMES_RBAC_ENFORCEMENT=enabled
      - HERMES_ACCESS_CONTROL_FILE=/hermes-runtime/access-control/users.json
      - DATABASE_URL=postgresql://hermes:${HERMES_POSTGRES_PASSWORD}@hermes-postgres:5432/hermes

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Reads Microsoft Graph mail notifications off RabbitMQ and hands them
  # to the same fetch/parse pipeline hermes-api already has. Separate
  # process from hermes-api on purpose: it's a blocking consume loop, not
  # a request handler, and a crash/restart here shouldn't take the web
  # app down with it (or vice versa).
  hermes-graph-consumer:
    build: .
    container_name: hermes-graph-consumer
    restart: unless-stopped
    init: true
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/hermes-graph-heartbeat').st_mtime < 30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: python scripts/hermes-850-graph-notification-consumer.py
    depends_on:
      hermes-postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://hermes:${HERMES_POSTGRES_PASSWORD}@hermes-postgres:5432/hermes

    volumes:
      - /opt/jobfynder-docs:/jobfynder-docs
      - /opt/hermes-runtime:/hermes-runtime

    extra_hosts:
      - "host.docker.internal:host-gateway"

  hermes-backfill-worker:
    build: .
    container_name: hermes-backfill-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/hermes-backfill-heartbeat').st_mtime < 150"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: python scripts/hermes-backfill-worker.py
    depends_on:
      hermes-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://hermes:${HERMES_POSTGRES_PASSWORD}@hermes-postgres:5432/hermes
    volumes:
      - /opt/jobfynder-docs:/jobfynder-docs:ro
      - /opt/hermes-runtime:/hermes-runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
